{% extends "base.html" %}

{% block title %}Đăng Nhập Quản Trị - Phòng Lập Trình Python LAN{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card glass-panel">
        <div class="login-header">
            <div class="logo-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>QUẢN TRỊ VIÊN</h2>
            <p>Hệ thống quản lý phòng thực hành Python LAN</p>
        </div>
        
        <form method="POST" action="{{ url_for('teacher_login') }}" class="login-form">
            {% if error %}
                <div class="error-banner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}
            
            <div class="input-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Mật khẩu truy cập</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu quản trị..." required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Đăng nhập</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
        <div class="author-credits" style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--color-text-muted); opacity: 0.7;">
            Tác giả phần mềm: <strong>Kiet1895_NGT</strong>
        </div>
    </div>
</div>
{% endblock %}
